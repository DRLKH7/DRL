site_name: Corvus Red Edition
site_description: Automated Pentest Platform
theme:
  name: material
  logo: img/logo.png
  favicon: img/logo.png
  palette:
    scheme: slate
    primary: deep purple
    accent: cyan
  features:
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide:
    - Overview: user-guide/overview.md
    - Scanning: user-guide/scan.md
    - Reports: user-guide/reports.md
  - Developer Guide:
    - API Integration: developer-guide/api-integration.md
  - Reference:
    - Vulnerability List: reference/vulnerabilities.md
    - Tools: reference/tools.md
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
